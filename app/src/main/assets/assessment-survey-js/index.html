<!doctype html>
<html class="assessment-survey-standalone">
  <head>
    <meta charset="utf-8" />
    <title>Assessment / Survey</title>

    <meta name="description" content="Assessment/Survey from Curious Learning" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link id="assessment-stylesheet" rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="container-overrides.css" />
  </head>

  <body class="assessment-survey-standalone">
    <!-- Container UI kept outside #assessment-survey-root so the bundle's render doesn't remove it -->
    <button class="landingCloseButton" id="landingPageCloseButton" aria-label="Close">×</button>

    <div
      id="assessment-survey-root"
      data-asset-base-url="assets"
      data-host-theme="default"
      data-show-loading-screen="true"
      data-show-ending-screen="true"
      data-show-devmode-bucket-info="true"
      data-show-devmode-toggle-button="true"
      data-show-devmode-settings="true"
    >
     <div id="loadingScreen">
        <img id="loading-gif" src="assets/img/loadingImg.gif" alt="Loading Animation" />
        <div id="progressBarContainer">
          <div id="progressBar"></div>
        </div>
      </div>
    </div>

    <div class="finalScoreScreenWrapper" id="finalScoreScreen" style="display: none">
      <button class="finalScoreCloseButton" id="finalScoreCloseButton" aria-label="Close">×</button>
      <div class="finalScoreContent">
        <div class="finalScoreLabel">Final Score</div>
        <div class="finalScoreValue" id="finalScoreValue">0</div>
        <div class="finalAssessmentName" id="finalAssessmentName">Assessment</div>
        <button class="finalScoreConfirmButton" id="finalScoreConfirmButton">
          <span class="confirmButtonText">Score recorded</span>
          <div class="confirmButtonProgressBar" id="finalScoreProgressBar"></div>
        </button>
      </div>
    </div>

    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGTWM534Z4"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'G-DGTWM534Z4');
	</script> -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.0/gsap.min.js"></script>

    <!-- Must load before bundle.js: hooks the bundle's end-of-game message -->
    <script src="container-overrides.js"></script>
    <script src="bundle.js"></script>
  </body>
</html>
